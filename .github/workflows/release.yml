# Release for kalide.
#
# Trigger: ONLY a human-pushed version tag vX.Y.Z. There is deliberately no
# workflow_dispatch and no scheduled/other trigger. This workflow never creates
# or moves a tag; the manifest commit (updating Formula/ and bucket/) is the one
# CI push allowed by global.constraint.humans-push-and-tag, and lives in the
# separate, later `manifest` job below.
#
# Shape:
#   build   -> cross-build the supported targets with the Makefile's single
#              `release` entry point (VERSION = the tag), produce checksums.txt
#              (SHA-256) and upload the binaries + checksums as one artifact;
#   native-e2e -> call the reusable native-e2e.yml in release mode, which
#              downloads that artifact and runs the offline native e2e on one
#              runner per supported target (its own matrix);
#   publish -> create the GitHub Release vX.Y.Z with the binaries + checksums,
#              but only after every native e2e job has passed (`needs`);
#   manifest -> regenerate Formula/kalide.rb and bucket/kalide.json from the
#              release tag + checksums.txt, assert only Formula/ and bucket/
#              changed, and push that manifest commit as the Actions bot.
#
# Target set (supported-platforms): darwin/arm64 and windows/amd64 are always
# built; windows/arm64 is built only while the GitHub-hosted `windows-11-arm`
# runner is available to this private repo, signalled by the repository
# variable WINDOWS_ARM_RUNNER == "true" (the same toggle native-e2e.yml reads).
# Never darwin/amd64, never Linux.
#
# Requirement ACs this workflow satisfies (audited in release-0.5.0 phase-05 task-1):
#   - github-releases: a pushed vX.Y.Z tag yields Release vX.Y.Z with
#     checksums.txt and one kalide-<os>-<arch> binary per supported target.
#   - supported-platforms / single-binary: `make release` builds from cmd/kalide;
#     darwin/arm64 + windows/amd64 always, windows/arm64 only when
#     WINDOWS_ARM_RUNNER == "true"; never darwin/amd64 or Linux.
#   - native-ci-verification: `publish` needs every native e2e job to pass.
#   - package-manifest-update: `manifest` rewrites Formula/ + bucket/ from
#     checksums.txt and fails if any other path changed.
#   - global.constraint.humans-push-and-tag: no tag is created (--verify-tag);
#     the manifest-only commit is the single CI push.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Least privilege by default; only `publish` (release) and `manifest` (the
# manifest-only push) need to write.
permissions:
  contents: read

jobs:
  build:
    name: Build release binaries
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The Makefile is the single build entry point; the release recipe is a
      # CGO_ENABLED=0 cross-build for exactly darwin/arm64, windows/amd64 and
      # windows/arm64 with -trimpath and the version stamped in. VERSION is the
      # pushed tag, passed through to `-X main.version`.
      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: make release

      # windows/arm64 is built/released only while its native runner exists. The
      # Makefile still cross-builds it unconditionally, so drop it here before
      # checksums and upload when the runner is unavailable — then the artifact,
      # checksums.txt and the Release carry exactly the supported targets.
      - name: Drop windows/arm64 when its runner is unavailable
        if: ${{ vars.WINDOWS_ARM_RUNNER != 'true' }}
        shell: bash
        run: rm -f dist/kalide-windows-arm64.exe

      # SHA-256 checksums over exactly the binaries shipped in this release, in
      # a fixed order. Format is `<hash>  <filename>` (two spaces), the form the
      # phase-09 task-5 manifest job and the Homebrew/Scoop manifests consume.
      - name: Write checksums.txt (SHA-256)
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          : > checksums.txt
          for f in kalide-darwin-arm64 kalide-windows-amd64.exe kalide-windows-arm64.exe; do
            if [ -f "$f" ]; then
              shasum -a 256 "$f" >> checksums.txt
            fi
          done
          cat checksums.txt

      # One artifact, downloaded by native-e2e.yml into dist/ in release mode.
      # Files sit at the artifact root so they land at dist/<name>, the paths
      # native-e2e.yml's matrix expects.
      - name: Upload binaries and checksums
        uses: actions/upload-artifact@v7
        with:
          name: kalide-binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Native verification of the exact artifacts built above, on one native runner
  # per supported target. The reusable workflow owns the per-target matrix and
  # downloads the `kalide-binaries` artifact (release mode) instead of
  # rebuilding, so each target's own binary is what gets tested.
  native-e2e:
    name: Native e2e
    needs: build
    uses: ./.github/workflows/native-e2e.yml
    with:
      release: true
      artifact-name: kalide-binaries
      version: ${{ github.ref_name }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  # Publish only after the build and EVERY native e2e job inside the reusable
  # workflow have succeeded: `needs: native-e2e` gates on the whole called
  # workflow, so any target's failure blocks publishing.
  publish:
    name: Publish release
    needs: [build, native-e2e]
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Re-fetch the very artifact native e2e verified.
      - uses: actions/download-artifact@v8
        with:
          name: kalide-binaries
          path: dist

      # Create the GitHub Release vX.Y.Z on the private repo with the binaries
      # and checksums.txt. `--verify-tag` guarantees the tag already exists
      # (the human pushed it); gh must never create one.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            dist/kalide-darwin-arm64
            dist/kalide-windows-amd64.exe
          )
          if [ -f dist/kalide-windows-arm64.exe ]; then
            assets+=(dist/kalide-windows-arm64.exe)
          fi
          assets+=(dist/checksums.txt)
          gh release create "$TAG" "${assets[@]}" \
            --verify-tag \
            --title "$TAG" \
            --notes "kalide $TAG. Assets: the supported platform binaries and checksums.txt (SHA-256)."

  # Regenerate the Homebrew/Scoop manifests after the Release exists, then push
  # them as the GitHub Actions bot. This is the one CI push allowed by
  # global.constraint.humans-push-and-tag; it never creates or moves a tag.
  #
  # The two manifests are pure placeholders at rest, so regeneration is a small
  # deterministic rewrite of exactly the lines their contracts name:
  #   - Formula/kalide.rb      version / url / sha256  (see its regeneration
  #                            contract and Formula/lib/…strategy.rb, which
  #                            requires the release-download URL form)
  #   - bucket/kalide.json     version / 64bit.hash, plus the whole
  #                            architecture.arm64 block only when the release
  #                            actually shipped kalide-windows-arm64.exe
  #                            (see bucket/README.md). The per-arch `url` is
  #                            deliberately NOT written: the assets are private
  #                            and Scoop's own downloader cannot authenticate, so
  #                            `pre_install` fetches the asset itself and the
  #                            manifest is hash-only (a `url` would make Scoop
  #                            fetch it unauthenticated and 404 before
  #                            `pre_install` runs).
  # checksums.txt is the release asset in `<hash>  <name>` (two spaces) form
  # written by `build`; the SHAs come from it so the manifests match the exact
  # published bytes.
  manifest:
    name: Update package manifests
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Check out the default branch so the bot commit lands on it rather than
      # on the detached tag ref.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      # Fetch the one machine-readable input: the checksums.txt uploaded with
      # the Release by `publish` (over the already-existing tag vX.Y.Z).
      - name: Download checksums.txt from the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --pattern checksums.txt --dir dist
          cat dist/checksums.txt

      # Rewrite only the placeholder lines the artifacts' regeneration contracts
      # name. python3 is used (present on the runner) so the URL/sha256 pairs are
      # matched by asset name rather than by brittle line numbers.
      - name: Regenerate Formula/kalide.rb and bucket/kalide.json
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$TAG" <<'PY'
          import json, pathlib, re, sys

          tag = sys.argv[1]
          version = tag[1:] if tag.startswith("v") else tag
          base = f"https://github.com/really-knows-ai/kalide/releases/download/{tag}"

          # checksums.txt: `<hash>  <name>` (two spaces, shasum -a 256).
          sums = {}
          for line in pathlib.Path("dist/checksums.txt").read_text().splitlines():
              line = line.strip()
              if not line:
                  continue
              digest, name = line.split(None, 1)
              sums[name.strip()] = digest.strip()

          darwin = sums["kalide-darwin-arm64"]
          amd64 = sums["kalide-windows-amd64.exe"]

          # --- Formula/kalide.rb: version / url / sha256 ---------------------
          formula = pathlib.Path("Formula/kalide.rb")
          text = formula.read_text()

          def replace_once(text, pattern, replacement):
              new, n = re.subn(pattern, replacement, text, flags=re.MULTILINE)
              if n != 1:
                  raise SystemExit(f"formula: expected exactly one match for {pattern!r}, got {n}")
              return new

          text = replace_once(text, r'^  url "https://github\.com/[^"]*"',
                              f'  url "{base}/kalide-darwin-arm64"')
          text = replace_once(text, r'^  version "[^"]*"', f'  version "{version}"')
          text = replace_once(text, r'^  sha256 "[^"]*"', f'  sha256 "{darwin}"')
          formula.write_text(text)

          # --- bucket/kalide.json: version / hashes / arm64 block -----------
          # The hash-only manifest: no per-arch `url` is written, because the
          # release assets are private and Scoop's downloader cannot send an
          # Authorization header. A `url` would make Scoop attempt an
          # unauthenticated fetch (404) before `pre_install` runs; `pre_install`
          # is the authenticated fetch that writes kalide.exe into $dir.
          bucket = pathlib.Path("bucket/kalide.json")
          manifest = json.loads(bucket.read_text())
          manifest["version"] = version
          manifest["architecture"]["64bit"].pop("url", None)
          manifest["architecture"]["64bit"]["hash"] = amd64

          arm64 = None
          if "kalide-windows-arm64.exe" in sums:
              arm64 = {
                  "hash": sums["kalide-windows-arm64.exe"],
              }
          # Add when released, remove when not, so the entry always matches the
          # assets actually shipped.
          if arm64 is None:
              manifest["architecture"].pop("arm64", None)
          else:
              manifest["architecture"]["arm64"] = arm64

          bucket.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      # The diff guard: the bot push may only ever touch Formula/ and bucket/.
      # Fail before staging/committing anything if any other path changed.
      - name: Assert the diff touches only Formula/ and bucket/
        shell: bash
        run: |
          set -euo pipefail
          paths=$(git status --porcelain | awk '{print $2}')
          if [ -z "$paths" ]; then
            echo "No manifest changes to commit (already current)."
            exit 0
          fi
          echo "$paths"
          bad=$(printf '%s\n' "$paths" | grep -Ev '^(Formula/|bucket/)' || true)
          if [ -n "$bad" ]; then
            echo "::error::manifest job touched paths outside Formula/ and bucket/:"
            printf '%s\n' "$bad"
            exit 1
          fi

      # Commit as the github-actions bot on the default branch and push. If the
      # regeneration produced no change, skip the commit entirely.
      - name: Commit and push manifest update
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Manifests already current; nothing to commit or push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ bucket/
          git commit -m "Update package manifests for ${GITHUB_REF_NAME}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
