# Release for kalide.
#
# Trigger: ONLY a version tag vX.Y.Z, created by a human — or by an agent acting
# under explicit, per-action human consent. There is deliberately no
# workflow_dispatch and no scheduled/other trigger. This workflow never creates
# or moves a tag; the manifest commit (updating Formula/ and bucket/) is the one
# CI push allowed by global.constraint.humans-push-and-tag, and lives in the
# separate, later `manifest` job below.
#
# Shape:
#   build   -> cross-build the supported targets with the Makefile's single
#              `release` entry point (VERSION = the tag), produce checksums.txt
#              (SHA-256) and upload the binaries + checksums as one artifact;
#   native-e2e -> call the reusable native-e2e.yml in release mode, which
#              downloads that artifact and runs the offline native e2e on one
#              runner per supported target (its own matrix);
#   publish -> create the GitHub Release vX.Y.Z with the binaries + checksums,
#              but only after every native e2e job has passed (`needs`);
#   manifest -> regenerate Formula/kalide.rb and bucket/kalide.json from the
#              release tag + checksums.txt, assert only Formula/ and bucket/
#              changed, and push that manifest commit as the Actions bot;
#   package-install-e2e -> after the manifest push, install anonymously via
#              brew (macOS) / scoop (Windows) from the public tap/bucket and
#              run e2e.TestAnonymousPackageInstall (no token env).
#
# Target set (supported-platforms): all six targets are always built and
# always GA - darwin/arm64, darwin/amd64, windows/amd64, windows/arm64,
# linux/amd64, linux/arm64. Every native runner these targets need is
# generally available (checked at plan time; see native-e2e.yml's matrix),
# so there is no per-target conditional here anymore.
#
# Requirement ACs this workflow satisfies (audited in release-0.5.0 phase-05 task-1):
#   - github-releases: a pushed vX.Y.Z tag yields Release vX.Y.Z with
#     checksums.txt and one kalide-<os>-<arch> binary per supported target.
#   - supported-platforms / single-binary: `make release` builds from cmd/kalide
#     for all six supported targets, unconditionally.
#   - native-ci-verification: `publish` needs every native e2e job to pass.
#   - package-manifest-update: `manifest` rewrites Formula/ + bucket/ from
#     checksums.txt and fails if any other path changed.
#   - global.constraint.humans-push-and-tag: no tag is created (--verify-tag);
#     the manifest-only commit is the single CI push.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Least privilege by default; only `publish` (release) and `manifest` (the
# manifest-only push) need to write. `actions: read` is required to download the
# build artifact: once a `permissions:` block is present, every scope it omits
# is denied, and actions/download-artifact needs actions: read.
permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build release binaries
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The Makefile is the single build entry point; the release recipe is a
      # CGO_ENABLED=0 cross-build for all six supported targets (darwin/arm64,
      # darwin/amd64, windows/amd64, windows/arm64, linux/amd64, linux/arm64)
      # with -trimpath and the version stamped in. VERSION is the pushed tag,
      # passed through to `-X main.version`.
      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: make release

      # SHA-256 checksums over exactly the binaries shipped in this release, in
      # a fixed order. Format is `<hash>  <filename>` (two spaces), the form the
      # phase-09 task-5 manifest job and the Homebrew/Scoop manifests consume.
      # Each entry is still guarded by `if [ -f ... ]` so a future runner
      # disappearing degrades gracefully instead of failing the build outright.
      - name: Write checksums.txt (SHA-256)
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          : > checksums.txt
          for f in kalide-darwin-arm64 kalide-darwin-amd64 kalide-windows-amd64.exe kalide-windows-arm64.exe kalide-linux-amd64 kalide-linux-arm64; do
            if [ -f "$f" ]; then
              shasum -a 256 "$f" >> checksums.txt
            fi
          done
          cat checksums.txt

      # One artifact, downloaded by native-e2e.yml into dist/ in release mode.
      # Files sit at the artifact root so they land at dist/<name>, the paths
      # native-e2e.yml's matrix expects.
      - name: Upload binaries and checksums
        uses: actions/upload-artifact@v7
        with:
          name: kalide-binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Native verification of the exact artifacts built above, on one native runner
  # per supported target. The reusable workflow owns the per-target matrix and
  # downloads the `kalide-binaries` artifact (release mode) instead of
  # rebuilding, so each target's own binary is what gets tested.
  native-e2e:
    name: Native e2e
    needs: build
    uses: ./.github/workflows/native-e2e.yml
    with:
      release: true
      artifact-name: kalide-binaries
      version: ${{ github.ref_name }}

  # Publish only after the build and EVERY native e2e job inside the reusable
  # workflow have succeeded: `needs: native-e2e` gates on the whole called
  # workflow, so any target's failure blocks publishing.
  publish:
    name: Publish release
    needs: [build, native-e2e]
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      # Re-fetch the very artifact native e2e verified.
      - uses: actions/download-artifact@v8
        with:
          name: kalide-binaries
          path: dist

      # Create the GitHub Release vX.Y.Z with the binaries
      # and checksums.txt. `--verify-tag` guarantees the tag already exists
      # (created by a human, or by an agent acting under explicit per-action
      # human consent); gh must never create one. This job has no
      # checkout, so `--repo` is required: gh cannot infer the repository from
      # a working tree that isn't there.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # All six targets are GA, so each is expected to be present; each is
          # still guarded by `if [ -f ... ]` so a future runner disappearing
          # degrades gracefully instead of failing the release outright.
          assets=()
          for f in \
            dist/kalide-darwin-arm64 \
            dist/kalide-darwin-amd64 \
            dist/kalide-windows-amd64.exe \
            dist/kalide-windows-arm64.exe \
            dist/kalide-linux-amd64 \
            dist/kalide-linux-arm64 \
          ; do
            if [ -f "$f" ]; then
              assets+=("$f")
            fi
          done
          assets+=(dist/checksums.txt)
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes "kalide $TAG. Assets: the supported platform binaries and checksums.txt (SHA-256)."

  # Regenerate the Homebrew/Scoop manifests after the Release exists, then push
  # them as the GitHub Actions bot. This is the one CI push allowed by
  # global.constraint.humans-push-and-tag; it never creates or moves a tag.
  #
  # The two manifests are pure placeholders at rest, so regeneration is a small
  # deterministic rewrite of exactly the lines their contracts name:
  #   - Formula/kalide.rb      version / per-arch public url + sha256 (see its
  #                            regeneration contract)
  #   - bucket/kalide.json     version / architecture.64bit url + hash, plus
  #                            the whole architecture.arm64 url + hash block
  #                            only when the release actually shipped
  #                            kalide-windows-arm64.exe (see bucket/README.md).
  # checksums.txt is the release asset in `<hash>  <name>` (two spaces) form
  # written by `build`; the SHAs come from it so the manifests match the exact
  # published bytes.
  manifest:
    name: Update package manifests
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Check out the default branch so the bot commit lands on it rather than
      # on the detached tag ref.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      # Fetch the one machine-readable input: the checksums.txt uploaded with
      # the Release by `publish` (over the already-existing tag vX.Y.Z).
      - name: Download checksums.txt from the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --pattern checksums.txt --dir dist
          cat dist/checksums.txt

      # Rewrite only the placeholder lines the artifacts' regeneration contracts
      # name. python3 is used (present on the runner) so the URL/sha256 pairs are
      # matched by asset name rather than by brittle line numbers.
      - name: Regenerate Formula/kalide.rb and bucket/kalide.json
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$TAG" <<'PY'
          import json, pathlib, re, sys

          tag = sys.argv[1]
          version = tag[1:] if tag.startswith("v") else tag
          base = f"https://github.com/really-knows-ai/kalide/releases/download/{tag}"

          # checksums.txt: `<hash>  <name>` (two spaces, shasum -a 256).
          sums = {}
          for line in pathlib.Path("dist/checksums.txt").read_text().splitlines():
              line = line.strip()
              if not line:
                  continue
              digest, name = line.split(None, 1)
              sums[name.strip()] = digest.strip()

          darwin_arm64 = sums["kalide-darwin-arm64"]
          darwin_amd64 = sums["kalide-darwin-amd64"]
          amd64 = sums["kalide-windows-amd64.exe"]

          # --- Formula/kalide.rb: version / TWO url+sha256 pairs -------------
          # There are two independent url/sha256 pairs, one per architecture
          # (Hardware::CPU.intel? branch -> kalide-darwin-amd64, else branch ->
          # kalide-darwin-arm64). Each pair is matched and replaced as a whole
          # block (url line through its sha256 line) keyed by the asset name
          # already present in that block's url, so the regex is robust to
          # which branch comes first and to the if/else structure — not
          # dependent on line position.
          formula = pathlib.Path("Formula/kalide.rb")
          text = formula.read_text()

          def replace_once(text, pattern, replacement, label):
              new, n = re.subn(pattern, replacement, text, flags=re.MULTILINE)
              if n != 1:
                  raise SystemExit(f"formula: expected exactly one match for {label!r}, got {n}")
              return new

          def replace_url_sha_pair(text, asset, digest):
              pattern = re.compile(
                  r'(url ")[^"]*/' + re.escape(asset) + r'('
                  r'"\n'
                  r'\s*sha256 ")[0-9a-fA-F]+(")'
              )
              new_text, n = pattern.subn(
                  lambda m: f'{m.group(1)}{base}/{asset}{m.group(2)}{digest}{m.group(3)}',
                  text,
                  count=1,
              )
              if n != 1:
                  raise SystemExit(
                      f"formula: expected exactly one url/sha256 match for {asset!r}, got {n}"
                  )
              return new_text

          text = replace_once(text, r'^  version "[^"]*"', f'  version "{version}"', "version")
          text = replace_url_sha_pair(text, "kalide-darwin-arm64", darwin_arm64)
          text = replace_url_sha_pair(text, "kalide-darwin-amd64", darwin_amd64)
          formula.write_text(text)

          # --- bucket/kalide.json: version / hashes / arm64 block -----------
          # Standard public manifest: each architecture carries the public
          # release-download url plus its SHA-256 hash; Scoop fetches and
          # verifies it anonymously.
          bucket = pathlib.Path("bucket/kalide.json")
          manifest = json.loads(bucket.read_text())
          manifest["version"] = version
          manifest["architecture"]["64bit"] = {
              "url": f"{base}/kalide-windows-amd64.exe#/kalide.exe",
              "hash": amd64,
          }

          arm64 = None
          if "kalide-windows-arm64.exe" in sums:
              arm64 = {
                  "url": f"{base}/kalide-windows-arm64.exe#/kalide.exe",
                  "hash": sums["kalide-windows-arm64.exe"],
              }
          # Add when released, remove when not, so the entry always matches the
          # assets actually shipped.
          if arm64 is None:
              manifest["architecture"].pop("arm64", None)
          else:
              manifest["architecture"]["arm64"] = arm64

          bucket.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      # The diff guard: the bot push may only ever touch Formula/ and bucket/.
      # Fail before staging/committing anything if any other path changed.
      - name: Assert the diff touches only Formula/ and bucket/
        shell: bash
        run: |
          set -euo pipefail
          paths=$(git status --porcelain | awk '{print $2}')
          if [ -z "$paths" ]; then
            echo "No manifest changes to commit (already current)."
            exit 0
          fi
          echo "$paths"
          bad=$(printf '%s\n' "$paths" | grep -Ev '^(Formula/|bucket/)' || true)
          if [ -n "$bad" ]; then
            echo "::error::manifest job touched paths outside Formula/ and bucket/:"
            printf '%s\n' "$bad"
            exit 1
          fi

      # Commit as the github-actions bot on the default branch and push. If the
      # regeneration produced no change, skip the commit entirely.
      - name: Commit and push manifest update
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Manifests already current; nothing to commit or push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ bucket/
          git commit -m "Update package manifests for ${GITHUB_REF_NAME}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

  # Post-publish anonymous install check. Runs only after `manifest` has pushed
  # the regenerated Formula/ and bucket/ to the default branch, so brew/scoop
  # install exactly the release just published. It does not gate publishing
  # (the Release already exists); a failure flags a broken public install.
  # No token is passed: the test installs anonymously from the public tap/bucket
  # and asserts `kalide version` reports the pushed tag (vX.Y.Z, as stamped by
  # `make release`). All four targets are always released (see the target-set
  # note above), so the matrix is static.
  package-install-e2e:
    name: Package install e2e ${{ matrix.target }}
    needs: manifest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin/arm64
            os: macos-14
          - target: darwin/amd64
            os: macos-15-intel
          - target: windows/amd64
            os: windows-latest
          - target: windows/arm64
            os: windows-11-arm
    steps:
      # The default branch, which now carries the manifest commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Homebrew is preinstalled on GitHub-hosted macOS runners; Scoop is not
      # on Windows runners, so install it and put its shims on PATH.
      - name: Install Scoop
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Invoke-RestMethod -Uri https://get.scoop.sh -OutFile install.ps1
          .\install.ps1 -RunAsAdmin
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\scoop\shims"

      - name: Run anonymous package install e2e
        env:
          KALIDE_RELEASE_VERSION: ${{ github.ref_name }}
        run: go test ./e2e -run TestAnonymousPackageInstall -v
