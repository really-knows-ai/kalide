# Reusable native end-to-end verification.
#
# Called by ci.yml (push/PR) and by release.yml (a human-pushed vX.Y.Z tag). One
# GitHub-hosted native runner per supported target; there is no self-hosted or
# manual fallback.
#
#   - darwin/arm64   -> macos-14
#   - darwin/amd64   -> macos-15-intel
#   - windows/amd64  -> windows-latest
#   - windows/arm64  -> windows-11-arm
#   - linux/amd64    -> ubuntu-latest
#   - linux/arm64    -> ubuntu-24.04-arm
#
# All six runners are GitHub-hosted and generally available today, so the
# matrix below is a plain static list, not conditionally assembled. There is
# deliberately no self-hosted runner and no manual verification path: if
# GitHub ever stops offering one of these runners, the fix is to remove that
# target's matrix line (and its build/publish counterparts), not to add a
# fallback.
#
# In both modes the binary under test lives at the same target-specific path
# under dist/ (the Makefile's layout):
#
#   - build mode (default; ci.yml): `make release` builds the CGO_ENABLED=0
#     release binary for all six supported targets;
#   - release mode (release.yml): the caller's build job has already produced
#     the binaries and uploaded them as an artifact, so this workflow downloads
#     that artifact into dist/ instead of rebuilding.
#
# Either way the job runs
# `go test ./e2e -run 'TestNativeRelease|TestDemoProject'` with KALIDE_BINARY
# pointing at the target binary, so both e2e tests drive the exact artifact for
# the runner's own target.
#
# The offline enforcement, URL parsing, process-group graceful stop and clean
# exit assertions live in the e2e package (TestNativeRelease / the Harness).
#
# Requirement ACs (audited in release-0.5.0 phase-05 task-2):
#   - native-ci-verification: one job per supported target on a GitHub-hosted
#     native runner (macos-14, macos-15-intel, windows-latest, windows-11-arm,
#     ubuntu-latest, ubuntu-24.04-arm), no self-hosted/manual fallback; each
#     job tests the binary built for its own target via KALIDE_BINARY and runs
#     e2e.TestNativeRelease (steps 1-6). fail-fast is off so every target
#     reports, and release.yml's `publish` needs this whole workflow, so any
#     failure blocks publishing.
#   - single-binary: cross-compiling alone is not accepted; the e2e runs natively.

name: Native e2e

on:
  workflow_call:
    inputs:
      release:
        description: Download prebuilt release binaries instead of building them
        type: boolean
        default: false
      artifact-name:
        description: Name of the artifact holding the release binaries (release mode)
        type: string
        default: kalide-binaries
      version:
        description: Version stamped into the built binaries (build mode)
        type: string
        default: dev
    secrets:
      token:
        description: Token used to download the release artifact from the private repo
        required: false

# actions: read is required to download the release artifact in release mode;
# a `permissions:` block denies every scope it omits, so it must be listed.
permissions:
  contents: read
  actions: read

jobs:
  e2e:
    name: e2e ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Static six-entry list: all six GitHub-hosted native runners are GA
        # today. If GitHub ever stops offering one of these runners, remove
        # that target's line here (and its Makefile/release.yml counterparts)
        # rather than adding a self-hosted or manual fallback.
        include:
          - target: darwin/arm64
            os: macos-14
            binary: dist/kalide-darwin-arm64
          - target: darwin/amd64
            os: macos-15-intel
            binary: dist/kalide-darwin-amd64
          - target: windows/amd64
            os: windows-latest
            binary: dist/kalide-windows-amd64.exe
          - target: windows/arm64
            os: windows-11-arm
            binary: dist/kalide-windows-arm64.exe
          - target: linux/amd64
            os: ubuntu-latest
            binary: dist/kalide-linux-amd64
          - target: linux/arm64
            os: ubuntu-24.04-arm
            binary: dist/kalide-linux-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Build mode (default): the Makefile is the single build entry point and
      # produces the CGO_ENABLED=0 release binary for this runner's target. It
      # must run under bash because the release recipe uses POSIX `mkdir -p` and
      # env-prefixed commands, which the default PowerShell shell on Windows
      # runners would not execute.
      - name: Build release binary
        if: ${{ !inputs.release }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: make release

      # Release mode: the caller's build job already produced the binaries; pull
      # them in at the same dist/ paths the build mode would use.
      - name: Download release binary
        if: ${{ inputs.release }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: dist
          github-token: ${{ secrets.token || github.token }}

      # TestNativeRelease drives the target binary through init, a clean
      # start --no-open, URL/asset checks, offline enforcement and a graceful
      # stop with clean-exit assertions. TestDemoProject drives the same
      # binary against the examples/demo fixture with the same offline/clean-
      # exit assertions.
      - name: Run native e2e
        env:
          KALIDE_BINARY: ${{ github.workspace }}/${{ matrix.binary }}
        run: go test ./e2e -run 'TestNativeRelease|TestDemoProject' -v
